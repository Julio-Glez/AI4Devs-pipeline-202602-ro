name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - feature-JGJ
  pull_request:
    branches:
      - main

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Apply database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
        run: npx prisma migrate deploy

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
        run: npm test

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Compile TypeScript
        working-directory: backend
        run: npm run build

      - name: Verify dist/ directory exists
        working-directory: backend
        run: test -d dist

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: CI=true npm test -- --watchAll=false --passWithNoTests

      - name: Build frontend for production
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs:
      - build-backend
      - build-frontend
    if: github.ref == 'refs/heads/feature-JGJ' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build backend on runner
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Build frontend on runner
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup PostgreSQL on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            sudo dnf install -y postgresql15-server
            sudo postgresql-setup --initdb 2>/dev/null || true
            printf '%s\n' 'local all postgres peer' 'local all all md5' 'host  all all 127.0.0.1/32 md5' 'host  all all ::1/128 md5' | sudo tee /var/lib/pgsql/data/pg_hba.conf > /dev/null
            sudo systemctl enable postgresql
            sudo systemctl restart postgresql
            sudo -u postgres psql -c "CREATE USER ltiuser WITH PASSWORD 'LTIpass2024!';" 2>/dev/null || true
            sudo -u postgres psql -c 'CREATE DATABASE "LTIdb" OWNER ltiuser;' 2>/dev/null || true
            sudo -u postgres psql -c 'GRANT ALL PRIVILEGES ON DATABASE "LTIdb" TO ltiuser;' 2>/dev/null || true
            sudo -u postgres psql -d "LTIdb" -c "GRANT ALL ON SCHEMA public TO ltiuser;" 2>/dev/null || true
            mkdir -p /home/ec2-user/app/backend
            mkdir -p /home/ec2-user/app/frontend

      - name: Copy backend artifacts to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "backend/dist,backend/prisma,backend/package.json,backend/package-lock.json"
          target: "/home/ec2-user/app/"

      - name: Copy frontend build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "frontend/build"
          target: "/home/ec2-user/app/"

      - name: Install deps, run migrations and restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e
            printf 'DATABASE_URL=postgresql://ltiuser:LTIpass2024!@localhost:5432/LTIdb\nPORT=3010\n' > /home/ec2-user/app/backend/.env
            export DATABASE_URL="postgresql://ltiuser:LTIpass2024!@localhost:5432/LTIdb"
            cd /home/ec2-user/app/backend
            npm ci --omit=dev
            npx prisma generate
            npx prisma migrate deploy
            pm2 restart backend || pm2 start dist/index.js --name backend
            pm2 save
            sudo cp -r /home/ec2-user/app/frontend/build/* /usr/share/nginx/html/
